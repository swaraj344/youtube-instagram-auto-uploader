name: Telegram Bot

permissions:
  contents: read
  actions: write  # lets the poller dispatch the main pipeline workflow

concurrency:
  group: telegram-bot
  cancel-in-progress: false

on:
  schedule:
    # Poll for user commands every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # /status reads the Drive folder, which needs Google credentials
      - name: Reconstruct Google credential files from secrets
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'EOF'
          import os, pathlib
          pathlib.Path("client_secret.json").write_text(os.environ["GOOGLE_CLIENT_SECRET_JSON"])
          pathlib.Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"])
          EOF

      - name: Poll Telegram for commands
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python telegram_commands.py
