name: Telegram Bot

permissions:
  contents: read
  actions: write  # lets the poller dispatch the main pipeline workflow

concurrency:
  group: telegram-bot
  cancel-in-progress: false

on:
  schedule:
    # Poll for user commands every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram for commands
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNELS_SECRETS_JSON: ${{ secrets.CHANNELS_SECRETS_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python telegram_commands.py
